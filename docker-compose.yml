services:
  ollama:
    image: ollama/ollama:latest
    container_name: rag-ollama
    ports:
      - "11434:11434"
    volumes:
      - ollama_data:/root/.ollama
    restart: unless-stopped
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    container_name: rag-backend
    ports:
      - "8000:8000"
    environment:
      OLLAMA_BASE_URL: http://ollama:11434
      DEFAULT_MODEL: ${DEFAULT_MODEL:-llama3}
      AVAILABLE_MODELS: ${AVAILABLE_MODELS:-llama3,mistral,gemma,qwen,deepseek-r1}
      DATA_DIR: /app/data
      CORS_ORIGINS: ${CORS_ORIGINS:-http://localhost:8000}
    volumes:
      - rag_data:/app/data
    depends_on:
      - ollama
    restart: unless-stopped
volumes:
  ollama_data:
  rag_data:
